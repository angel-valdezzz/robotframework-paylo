{% extends "base.html" %}
{% block content %}
<div class="documentation-language-block">
  <strong>{{ config.site_name }}</strong>
  <nav aria-label="{{ 'Idioma' if config.theme.language == 'es' else 'Language' }}">
  {% for alt in config.extra.alternate %}
    <a href="{{ alt.link ~ (page.url if page else '') }}" hreflang="{{ alt.lang }}"{% if alt.lang == config.theme.language %} aria-current="page"{% endif %}>{{ alt.name }}</a>{% if not loop.last %} · {% endif %}
  {% endfor %}
  </nav>
</div>
{{ super() }}
{% endblock %}
