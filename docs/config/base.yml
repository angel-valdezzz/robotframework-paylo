site_name: Paylo
site_description: Paylo for Python and Robot Framework.
site_url: https://angel-valdezzz.github.io/robotframework-paylo/
repo_url: https://github.com/angel-valdezzz/robotframework-paylo
repo_name: Paylo

theme:
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  font: false
  custom_dir: docs/overrides
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant.prefetch
    - navigation.instant.preview
    - content.code.annotate
    - content.code.select
    - content.tooltips
    - navigation.instant
    - navigation.instant.progress
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.path
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro

plugins:
  - search
  - git-revision-date-localized:
      enable_creation_date: false
      fallback_to_build_date: true
      locale: es
      type: datetime

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - abbr
  - footnotes
  - pymdownx.snippets
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      linenums: true
      linenums_style: pymdownx-inline
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - assets/stylesheets/landing.css
  - assets/stylesheets/standard.css
  - assets/stylesheets/visual.css

extra_javascript:
  - assets/navigation.js?v=locale-3
  - assets/mermaid.min.js
  - assets/landing.js
  - assets/keyword-links.js

extra:
  scope: /robotframework-paylo/
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/angel-valdezzz/robotframework-paylo
      name: Paylo on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/robotframework-paylo/
      name: Paylo on PyPI
  generator: false
  alternate:
    - name: English
      link: https://angel-valdezzz.github.io/robotframework-paylo/
      lang: en
    - name: Español
      link: https://angel-valdezzz.github.io/robotframework-paylo/es/
      lang: es

hooks:
  - docs/scripts/navigation.py
