name: Publish to PyPI
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[robot,dev]" poetry==2.5.1
      - name: Verify release tag
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          test "$RELEASE_TAG" = "v$(poetry version -s)"
          git merge-base --is-ancestor HEAD origin/main
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - run: robot --outputdir output examples/quickstart.robot
      - run: python docs/scripts/build_docs.py
      - run: poetry build
      - run: twine check dist/*
      - run: python scripts/wheel_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: distribution
          path: dist/*
  publish:
    if: github.event_name == 'release' && !github.event.release.prerelease
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/robotframework-paylo
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distribution
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
