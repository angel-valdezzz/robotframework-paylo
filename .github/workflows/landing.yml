name: Animated documentation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  landing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install poetry==2.5.1 playwright==1.58.0
      - uses: browser-actions/setup-chrome@v2
      - run: python -m pip install -e ".[robot,dev]"
      - run: python docs/scripts/generate_demo_screenshots.py
      - run: python docs/scripts/build_docs.py
      - run: python -m playwright install --with-deps chromium
      - run: python docs/scripts/verify_landing.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: landing-screenshots
          path: build/landing-checks/
