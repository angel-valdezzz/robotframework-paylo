name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[robot,dev]" poetry==2.5.1
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --cov=paylo --cov-report=term-missing
      - run: robot --outputdir output examples/quickstart.robot
      - run: python docs/scripts/build_docs.py
      - run: poetry build
      - run: twine check dist/*
      - run: python scripts/wheel_smoke.py
