name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install Chrome
        uses: browser-actions/setup-chrome@v2
      - run: python -m pip install -e ".[robot,dev]" poetry==2.5.1
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --cov=paylo --cov-report=term-missing
      - run: robot --outputdir output examples/quickstart.robot
      - run: python docs/scripts/generate_demo_screenshots.py
      - run: python docs/scripts/build_docs.py
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify translated navigation and theme storage
        run: |
          npm install --prefix build/navigation-ui jsdom@26.1.0 --no-audit --no-fund
          NODE_PATH="$PWD/build/navigation-ui/node_modules" node docs/scripts/verify_navigation.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: documentation-preview-${{ matrix.python }}
          path: site/
          retention-days: 1
      - run: poetry build
      - run: twine check dist/*
      - run: python scripts/wheel_smoke.py
