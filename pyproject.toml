[project]
name = "robotframework-paylo"
version = "0.1.0"
description = "Paylo: safe, type-preserving JSON payload templates."
authors = [{name = "Angel Gerardo Molina Valdez", email = "angelgerardomolinavaldez@gmail.com"}]
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []
classifiers = ["Development Status :: 4 - Beta", "Framework :: Robot Framework", "Programming Language :: Python :: 3", "Topic :: Software Development :: Testing"]
[project.optional-dependencies]
robot = ["robotframework>=7,<8"]
dev = ["selenium>=4.20,<5", "pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.15,<0.16", "mkdocs-material[imaging]>=9.7,<10", "mkdocs-git-revision-date-localized-plugin>=1.5,<2", "pygments>=2.19,<3", "twine>=6,<7"]
[project.urls]
Homepage = "https://angel-valdezzz.github.io/robotframework-paylo/"
Repository = "https://github.com/angel-valdezzz/robotframework-paylo"
Issues = "https://github.com/angel-valdezzz/robotframework-paylo/issues"
[tool.poetry]
packages = [{include="paylo", from="src"}, {include="Paylo", from="src"}]
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["site", "build", "dist", "docs/en/assets", "docs/es/assets"]
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[build-system]
requires = ["poetry-core>=2,<3"]
build-backend = "poetry.core.masonry.api"
